<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Your voice report | Maktoub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F1EA;--paper-2:#EAE5DC;--card:#FBF9F5;--ink:#111111;--ink-2:#34322F;--navy:#142C4B;--navy-soft:#9fb4d1;--grey:#C9C1B7;--hair:#CFC8BD;--smoke:#6B665F;--white:#fff;
  --ok:#2f6b4f;--mid:#a8741a;--err:#9b2c2c;--ok-bg:rgba(47,107,79,.08);--mid-bg:rgba(168,116,26,.09);--err-bg:rgba(155,44,44,.08);
  --pad:clamp(20px,4vw,56px);--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--serif:"Newsreader","Iowan Old Style","Times New Roman",serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px}[hidden]{display:none!important}
::selection{background:var(--navy);color:var(--white)}
.k{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);margin:0;line-height:1.4;font-family:var(--sans)}
.k.ink{color:var(--ink)}
p{margin:0 0 14px}
.muted{color:var(--smoke)}

/* chrome */
header.top{position:sticky;top:0;z-index:30;background:rgba(244,241,234,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:58px;padding:0 var(--pad);max-width:1240px;margin:0 auto}
.brand{font-size:14px;font-weight:500;letter-spacing:.14em;text-decoration:none}
.who{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who a{text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:1px;margin-left:12px;color:var(--ink)}
.views{display:flex;gap:26px;padding:0 var(--pad);max-width:1240px;margin:0 auto;border-top:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar,.chapters::-webkit-scrollbar{display:none}
.views button{flex-shrink:0;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);padding:14px 0 12px;border-bottom:2px solid transparent}
.views button[aria-selected=true]{color:var(--ink);border-color:var(--navy)}
.chapters{position:sticky;top:58px;z-index:20;background:rgba(244,241,234,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.chapters .in{display:flex;gap:24px;padding:0 var(--pad);max-width:1240px;margin:0 auto;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.chapters button{flex-shrink:0;font-size:15px;color:var(--smoke);padding:13px 0 11px;border-bottom:2px solid transparent;white-space:nowrap}
.chapters button .n{font-size:10px;letter-spacing:.1em;margin-right:6px;vertical-align:2px}
.chapters button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.preview{background:var(--navy);color:var(--white);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:7px 12px}

main{max-width:1240px;margin:0 auto;padding:0 var(--pad) 80px;min-height:70vh}
.chapter{animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* hero */
.hero{padding:clamp(40px,8vw,104px) 0 clamp(28px,4vw,48px);border-bottom:1px solid var(--hair);display:grid;gap:22px}
.hero h1{font-size:clamp(46px,10.5vw,112px);font-weight:500;letter-spacing:-.04em;line-height:.94;margin:10px 0 0;max-width:12ch}
.hero .lead{font-size:clamp(18px,2.2vw,23px);line-height:1.38;color:var(--ink-2);max-width:40ch;margin:0}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 22px}
@media(min-width:900px){.hero{grid-template-columns:1.35fr 1fr;align-items:end}.hero .side{padding-bottom:6px}}

/* pills */
.pills{display:flex;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--pad));padding:0 var(--pad)}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:1 0 auto;min-width:82px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);padding:17px 12px 15px;border-bottom:2px solid transparent;text-align:center}
.pills button[aria-selected=true]{color:var(--ink);border-color:var(--navy)}
@media(min-width:900px){.pills button{flex:0 0 auto;padding:17px 22px 15px}}
.panel{padding:clamp(28px,5vw,56px) 0 0;animation:in .35s var(--ease)}
.panel+.panel{border-top:1px solid var(--hair);margin-top:40px}
.panel-title{display:none}

/* type */
.q{font-size:clamp(22px,2.6vw,30px);font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:8px 0 18px;max-width:26ch}
.big{font-size:clamp(44px,8vw,84px);font-weight:500;letter-spacing:-.035em;line-height:.98;margin:6px 0 10px}
.word{font-family:var(--serif);font-weight:400;letter-spacing:-.025em}
.sub{font-size:19px;color:var(--smoke);margin:0 0 16px}
.body{font-size:17px;line-height:1.65;color:var(--ink-2);max-width:60ch}
.line{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;color:var(--ink);border-top:1px solid var(--hair);padding-top:16px;margin-top:20px;max-width:46ch}
.split{display:grid;gap:clamp(28px,5vw,64px)}
@media(min-width:900px){.split{grid-template-columns:1fr 1fr}.split.wide{grid-template-columns:1.2fr 1fr}}
.block{border-top:1px solid var(--ink);padding-top:14px;margin-top:28px}
.block .k{margin-bottom:8px}
.block p{font-size:16px;color:var(--ink-2);line-height:1.6;max-width:60ch}

.more{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:4px;margin-top:10px}
.more svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{display:inline-block;border:1px solid var(--hair);padding:6px 11px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--card)}
.test{position:relative;margin:48px 0 0;padding:22px 24px;background:var(--card);border:1px solid var(--hair)}
.test .k{color:var(--navy);margin-bottom:8px}
.test p{font-family:var(--serif);font-size:21px;line-height:1.38;margin:0}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:64px;padding:22px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--hair);width:100%;text-align:left}
.next b{display:block;font-weight:500;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;line-height:1.1}
.next svg{width:28px;height:28px;flex-shrink:0;transition:transform .3s var(--ease)}
.next:hover svg{transform:translateX(4px)}

/* overview */
.signals{display:grid;grid-template-columns:1fr;border-top:1px solid var(--ink);margin-top:28px}
.signals article{padding:20px 0;border-bottom:1px solid var(--hair);display:grid;gap:6px}
.signals strong{font-weight:500;font-size:clamp(22px,2.4vw,28px);letter-spacing:-.02em;line-height:1.12}
.signals small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
@media(min-width:700px){.signals{grid-template-columns:1fr 1fr}.signals article:nth-child(odd){padding-right:28px;border-right:1px solid var(--hair)}.signals article:nth-child(even){padding-left:28px}}
@media(min-width:1100px){.signals{grid-template-columns:repeat(4,1fr)}.signals article{padding:22px 22px 22px 0!important;border-right:1px solid var(--hair)}.signals article+article{padding-left:22px!important}.signals article:last-child{border-right:0}}
.layers{display:grid;gap:0;border-top:1px solid var(--hair);margin-top:48px}
.layers article{padding:22px 0;border-bottom:1px solid var(--hair)}
.layers h3{font-size:22px;font-weight:500;letter-spacing:-.015em;margin:6px 0 6px}
.layers p{font-size:15.5px;color:var(--smoke);margin:0}
@media(min-width:900px){.layers{grid-template-columns:repeat(3,1fr)}.layers article{padding:24px 24px 24px 0;border-right:1px solid var(--hair)}.layers article+article{padding-left:24px}.layers article:last-child{border-right:0}}
ol.qs{list-style:none;counter-reset:q;margin:12px 0 0;padding:0}
ol.qs li{counter-increment:q;display:grid;grid-template-columns:44px 1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--hair);font-family:var(--serif);font-size:clamp(19px,2vw,23px);line-height:1.35}
ol.qs li:before{content:counter(q,decimal-leading-zero);font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--smoke);padding-top:7px}
.toc{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--ink)}
.toc button{display:grid;grid-template-columns:44px 1fr 24px;gap:8px;align-items:baseline;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--hair)}
.toc .n{font-size:11px;letter-spacing:.1em;color:var(--smoke)}
.toc b{font-weight:500;font-size:20px;letter-spacing:-.01em;display:block}
.toc span.d{font-size:14.5px;color:var(--smoke);display:block;margin-top:2px}
.toc svg{width:18px;height:18px;align-self:center}
.disc{font-size:13px;color:var(--smoke);margin-top:48px;max-width:70ch}

/* emotional */
.emo{max-width:760px}
.tones{display:grid;gap:0;border-top:1px solid var(--hair);margin-top:12px}
.tones article{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--hair)}
.tones .note{font-family:var(--serif);font-size:44px;line-height:1;color:var(--navy)}
.tones p{margin:0;font-size:15.5px;color:var(--ink-2)}
@media(min-width:900px){.tones{grid-template-columns:1fr 1fr}.tones article:first-child{padding-right:28px;border-right:1px solid var(--hair)}.tones article+article{padding-left:28px}}

/* sensory flow */
.flow{display:grid;gap:12px;align-items:stretch;margin:4px 0 22px}
.flow .stage{background:var(--card);border:1px solid var(--hair);padding:20px}
.flow .stage h4{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,46px);letter-spacing:-.02em;line-height:1;margin:8px 0 14px}
.flow .arrow{display:flex;align-items:center;justify-content:center;color:var(--smoke)}
.flow .arrow svg{width:26px;height:26px;transform:rotate(90deg)}
.node{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--hair);font-size:15px}
.node span.t{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);min-width:70px}
.node b{font-weight:500;flex:1}
.node svg{width:16px;height:16px;color:var(--smoke)}
@media(min-width:760px){.flow{grid-template-columns:1fr 48px 1fr}.flow .arrow svg{transform:none}}

/* brain */
.hemi{margin:22px 0 26px}
.hemi .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:10px}
.hemi .num{font-size:clamp(34px,5vw,48px);font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hemi .side.dim .num{color:var(--grey)}
.hemi .side.r{text-align:right}
.hemi .side small{display:block;font-size:13px;color:var(--smoke);margin-top:4px}
.hemi .trk{display:flex;height:10px;background:var(--paper-2)}
.hemi .trk i{display:block;height:100%;transition:width 1.2s var(--ease)}
.hemi .trk i.l{background:var(--grey)}.hemi .trk i.r{background:var(--navy)}
.hemi .trk.lead-l i.l{background:var(--navy)}.hemi .trk.lead-l i.r{background:var(--grey)}

/* stress */
.gauge{margin:20px 0 28px}
.gauge .val{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.gauge .val b{font-size:clamp(64px,11vw,104px);font-weight:500;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.gauge .scale{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding-top:26px}
.gauge .seg{height:8px;background:var(--paper-2)}
.gauge .seg.on{background:var(--navy)}
.gauge .seg.past{background:var(--navy-soft)}
.gauge .lab{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px}
.gauge .lab span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--smoke);line-height:1.3}
.gauge .lab span.on{color:var(--ink);font-weight:600}
.gauge .lab em{display:block;font-style:normal;letter-spacing:0;font-size:11px;color:var(--grey);margin-top:2px}
.gauge .pin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1.2s var(--ease)}
.gauge .pin:after{content:"";width:1.5px;height:16px;background:var(--ink);margin-top:2px}
.gauge .pin span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap}
blockquote.src{margin:24px 0 0;padding:18px 0 0;border-top:1px solid var(--hair);font-size:15px;color:var(--smoke);max-width:62ch}
blockquote.src .k{margin-bottom:6px}

/* lists / accordion */
.acc{border-top:1px solid var(--ink);margin-top:12px}
.acc .it{border-bottom:1px solid var(--hair)}
.acc .hd{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:15px 0}
.acc .hd .n{font-size:11px;letter-spacing:.1em;color:var(--smoke)}
.acc .hd b{font-weight:500;font-size:17px;line-height:1.3}
.acc .hd small{display:block;font-size:12.5px;color:var(--smoke);margin-top:2px}
.acc .hd .ic{width:18px;height:18px;transition:transform .25s var(--ease);color:var(--smoke)}
.acc .it.open .ic{transform:rotate(45deg)}
.acc .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.acc .it.open .bd{grid-template-rows:1fr}
.acc .bd>div{overflow:hidden}
.acc .bd p{padding:0 0 16px 46px;margin:0;font-size:15.5px;color:var(--ink-2);max-width:62ch}
.acc .plain .hd{cursor:default}
.lvl{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--paper-2);border:1px solid var(--grey)}
.lvl i.f{background:currentColor;border-color:currentColor}
.lvl.High{color:var(--ok)}.lvl.Good{color:var(--navy)}.lvl.Low{color:var(--err)}
.lvl .dots{display:flex;gap:3px}

/* pattern map */
.pmap{position:relative;width:100%;max-width:520px;aspect-ratio:4/3;margin:8px auto 8px}
.pmap svg{position:absolute;inset:0;width:100%;height:100%}
.pmap svg line{stroke:var(--grey);stroke-width:1;stroke-dasharray:3 4;transition:stroke .3s}
.pmap svg line.on{stroke:var(--navy);stroke-dasharray:none;stroke-width:1.4}
.pmap .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);text-align:center;line-height:1.2}
.pmap .pn{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--hair);padding:8px 12px;font-size:13px;font-weight:500;line-height:1.2;max-width:42%;text-align:center;transition:background .25s,color .25s,border-color .25s}
.pmap .pn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pdetail{max-width:640px;margin:18px auto 0;min-height:220px}
.pdetail h3{font-size:clamp(26px,3vw,34px);font-weight:500;letter-spacing:-.02em;margin:8px 0 12px}
.pdetail .sum{font-weight:500;font-size:17px;margin-bottom:8px}
.cues{display:grid;gap:0;border-top:1px solid var(--hair);margin-top:8px}
.cues>div{padding:12px 0;border-bottom:1px solid var(--hair)}
.cues b{font-weight:500;display:block}
.cues p{margin:2px 0 0;font-size:15px;color:var(--smoke)}

/* body */
.bsel{border-top:1px solid var(--ink)}
.bsel button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:17px 4px 17px 0;border-bottom:1px solid var(--hair);font-size:17px;transition:padding .25s var(--ease)}
.bsel button svg{width:18px;height:18px;color:var(--grey)}
.bsel button[aria-selected=true]{font-weight:500;padding-left:12px;box-shadow:inset 2px 0 0 var(--navy)}
.bsel button[aria-selected=true] svg{color:var(--ink)}
.bdetail{background:var(--card);border:1px solid var(--hair);padding:clamp(20px,3vw,32px);animation:in .3s var(--ease)}
.bdetail h3{font-size:clamp(24px,3vw,32px);font-weight:500;letter-spacing:-.02em;margin:8px 0 12px;line-height:1.1}
.bdetail .k{margin-top:18px;margin-bottom:6px}
.bdetail p{font-size:15.5px;color:var(--ink-2);margin:0}
.bdetail p.int{font-size:18px;color:var(--ink)}
.bdetail .line{font-size:19px}
@media(min-width:900px){.bodygrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}}

/* journey */
.jchart{background:var(--card);border:1px solid var(--hair);padding:20px 16px 14px;margin-top:24px;max-width:980px}
.jchart svg{width:100%;height:auto;display:block;overflow:visible}
.jchart .band{opacity:1}
.jchart text{font-family:var(--sans);font-size:10px;letter-spacing:.06em;fill:var(--smoke)}
.jchart .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.8s var(--ease)}
.jchart.on .ln{stroke-dashoffset:0}
.jchart .dot{stroke:var(--card);stroke-width:2;opacity:0;transition:opacity .4s}
.jchart.on .dot{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12px;color:var(--smoke)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.markers{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);margin-top:28px}
.markers>div{padding:16px 12px 16px 0;border-bottom:1px solid var(--hair)}
.markers b{display:block;font-weight:500;font-size:19px;letter-spacing:-.01em;margin-top:4px;line-height:1.2}
@media(min-width:760px){.markers{grid-template-columns:repeat(var(--n,3),1fr)}.markers>div+div{padding-left:16px;border-left:1px solid var(--hair)}}
.jcard{max-width:720px}
.jcard p:not(.k){font-family:var(--serif);font-size:clamp(21px,2.4vw,26px);line-height:1.38;color:var(--ink);margin:8px 0 0}

/* right-brain adaptations: one image per chapter, the whole map first, shapes before lists */
.image{padding:clamp(26px,5vw,48px) 0;border-bottom:1px solid var(--hair);display:grid;gap:10px}
.image p{font-family:var(--serif);font-style:italic;font-size:clamp(25px,3.6vw,40px);line-height:1.22;letter-spacing:-.015em;margin:0;max-width:30ch;color:var(--ink)}
.wmap{position:relative;width:100%;max-width:620px;aspect-ratio:1/1;margin:8px auto 0}
.wmap svg{position:absolute;inset:0;width:100%;height:100%}
.wmap .ring{fill:none;stroke:var(--hair);stroke-width:1}
.wmap .spoke{stroke:var(--grey);stroke-width:1;stroke-dasharray:2 5}
.wmap .me{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1/1;border-radius:50%;background:var(--navy);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.wmap .me b{font-family:var(--serif);font-weight:400;font-size:clamp(20px,3.4vw,30px);line-height:1}
.wmap .me span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-top:4px}
.wmap .wn{position:absolute;transform:translate(-50%,-50%);width:31%;text-align:center;padding:10px 8px;background:var(--card);border:1px solid var(--hair);transition:border-color .2s,transform .25s var(--ease)}
.wmap .wn:hover{border-color:var(--ink);transform:translate(-50%,-52%)}
.wmap .wn .k{font-size:9.5px}
.wmap .wn b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(16px,2.4vw,22px);line-height:1.12;margin-top:4px}
.ways{display:grid;gap:22px;margin-top:28px}
.ways ul{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--ink)}
.ways li{padding:10px 0 10px 20px;border-bottom:1px solid var(--hair);font-size:15.5px;position:relative;color:var(--ink-2)}
.ways li:before{content:"";position:absolute;left:2px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.ways .dr li:before{background:var(--err)}
@media(min-width:760px){.ways{grid-template-columns:1fr 1fr;gap:40px}}
.radar{max-width:440px;margin:6px auto 18px}
.radar svg{width:100%;height:auto;overflow:visible}
.radar text{font-family:var(--sans);font-size:11px;fill:var(--ink-2)}
.radar .ax{stroke:var(--hair);stroke-width:1}.radar .rg{fill:none;stroke:var(--hair);stroke-width:1}
.radar .sh{fill:rgba(20,44,75,.12);stroke:var(--navy);stroke-width:1.6;stroke-linejoin:round}
/* notes */
.empty{text-align:center;padding:clamp(60px,12vw,140px) 0;max-width:420px;margin:0 auto}
.empty .mark{width:56px;height:56px;margin:0 auto 18px;border:1px solid var(--hair);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.empty h2{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 8px}
.prose{max-width:68ch;padding-top:clamp(28px,5vw,48px)}
.prose p{font-size:17.5px;line-height:1.7;color:var(--ink-2)}

/* booking */
.book{margin-top:clamp(28px,5vw,48px);border-top:1px solid var(--ink);padding-top:16px}
.calframe{margin:18px 0 6px;border:1px solid var(--hair);background:var(--white)}
.calframe iframe{display:block;width:100%;height:640px;border:0}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);text-decoration:none;padding:15px 22px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-top:14px}
.cta svg{width:16px;height:16px}.cta:disabled{opacity:.5}
/* assessments */
.tests{display:grid;gap:14px;margin-top:14px}
@media(min-width:860px){.tests{grid-template-columns:1fr 1fr}}
.test-card{background:var(--card);border:1px solid var(--hair);padding:22px;display:flex;flex-direction:column;gap:6px}
.test-card h3{font-size:clamp(24px,3vw,30px);font-weight:500;letter-spacing:-.02em;margin:4px 0 4px}
.test-card p{font-size:15.5px;color:var(--ink-2);margin:0}
.test-card .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--smoke);margin-top:8px}
.test-card .meta .ok{color:var(--ok);font-weight:600}
.test-card .cta{align-self:flex-start}
.quiz{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px var(--pad)}
.qtop .x{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--ink)}
.qbar{height:3px;background:var(--paper-2)}.qbar i{display:block;height:100%;width:0;background:var(--navy);transition:width .4s var(--ease)}
.qbody{flex:1;overflow:auto;padding:clamp(28px,7vw,72px) var(--pad);max-width:760px;width:100%;margin:0 auto;animation:in .3s var(--ease)}
.qbody h2{font-size:clamp(30px,5vw,48px);font-weight:500;letter-spacing:-.03em;line-height:1.08;margin:10px 0 24px}
.qbody h2.stmt{font-family:var(--serif);font-weight:400;letter-spacing:-.015em}
.likert{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--hair);background:var(--card);font-size:16px;transition:background .15s,border-color .15s}
.opt .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--grey);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--smoke);flex-shrink:0}
.opt:hover{border-color:var(--ink)}
.opt[aria-checked=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.opt[aria-checked=true] .n{border-color:var(--paper);color:var(--paper)}
.qnav{display:flex;justify-content:space-between;margin-top:18px}
.qback{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--smoke);padding:8px 0}.qback:disabled{opacity:.3}
.qmsg{font-size:14px;color:var(--err);min-height:20px;margin-top:12px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.38);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);max-height:88vh;overflow:auto;padding:12px var(--pad) calc(28px + env(safe-area-inset-bottom));transform:translateY(102%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s;border-top:1px solid var(--hair)}
.sheet.on{transform:none;visibility:visible;transition:transform .38s var(--ease)}
.sheet .grab{width:40px;height:4px;background:var(--grey);margin:0 auto 22px}
.sheet .x{position:absolute;top:14px;right:var(--pad);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--ink)}
.sheet h2{font-size:clamp(40px,8vw,64px);font-weight:500;letter-spacing:-.035em;line-height:1;margin:6px 0 20px}
.sheet .block:first-of-type{margin-top:10px}
@media(min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(640px,92vw);transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .3s,transform .35s var(--ease);border:1px solid var(--hair);padding:40px 44px}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}.sheet .grab{display:none}.sheet .x{top:22px}}

/* gate */
.gate{max-width:560px;margin:0 auto;padding:clamp(80px,14vw,160px) 0;text-align:center}
.gate h1{font-size:clamp(34px,6vw,52px);font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:12px 0 14px}
.gate p{color:var(--smoke)}
.gate a.btn{display:inline-block;margin-top:14px;background:var(--ink);color:var(--paper);text-decoration:none;padding:13px 20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.spin{width:28px;height:28px;border:1.5px solid var(--hair);border-top-color:var(--navy);border-radius:50%;margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{max-width:1240px;margin:0 auto;padding:22px var(--pad) 40px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12px;color:var(--smoke)}
footer button{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--smoke)}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* print: every chapter, every panel */
#print{display:none}
@media print{
  @page{margin:16mm 14mm}
  body{background:#fff;font-size:12pt}
  header.top,.chapters,.preview,main,footer,.scrim,.sheet{display:none!important}
  #print{display:block}
  #print .chapter{break-before:page;animation:none}
  #print .chapter:first-child{break-before:auto}
  #print .pills,#print .more,#print .next{display:none!important}
  #print .panel-title{display:block;margin:0 0 6px}
  #print .panel{padding-top:22px;animation:none;break-inside:avoid-page}
  #print .hero{padding:0 0 18px}
  #print .hero h1{font-size:44pt}
  #print .acc .bd{grid-template-rows:1fr}
  #print .jchart .ln{stroke-dashoffset:0}#print .jchart .dot{opacity:1}
  #print .sheetcopy{display:block!important}
}
.sheetcopy{display:none}

<body>
<header class="top">
  <div class="bar"><a class="brand" href="/ready/" id="brand">MAKTOUB</a><div class="who" id="who"></div></div>
  <div class="views" role="tablist" aria-label="Report sections" id="views" hidden>
    <button role="tab" data-v="report" aria-selected="true">Voice report</button>

    <button role="tab" data-v="recs" aria-selected="false">Recommendations</button>
  </div>
</header>
<div class="preview" id="previewBar" hidden>Founder preview · not visible to the client until published</div>
<nav class="chapters" id="chapters" hidden aria-label="Chapters"><div class="in" role="tablist" id="chapterTabs"></div></nav>
<main id="main"><div class="gate" id="gate"><div class="spin" aria-hidden="true"></div><p style="margin-top:18px">Opening your report…</p></div></main>
<div id="print"></div>
<script src="/ready/report/assessments.js"></script>
<footer id="foot" hidden><span id="footText">A signal layer to explore during the programme. Not a diagnosis.</span><button id="printBtn" type="button">Save as PDF</button></footer>
<div class="quiz" id="quiz" hidden role="dialog" aria-modal="true" aria-labelledby="quizName"><div class="qtop"><span class="k" id="quizName"></span><span class="k" id="quizCount"></span><button class="x" id="quizClose" type="button">Save and close</button></div><div class="qbar"><i id="quizBar"></i></div><div class="qbody" id="quizBody"></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="grab"></div><button class="x" id="sheetX" type="button">Close</button><div id="sheetBody"></div></div>

<script>
(() => {
'use strict';
const API = 'https://pmjvpnqmklxxpswwvbmv.supabase.co/functions/v1/maktoub-programme';
const KEY = 'maktoub_ready', PREVIEW_KEY = 'maktoub_report_preview';
// Google Calendar appointment page for the report review (60–90 minutes). A report can override it (notes.booking_url).
const BOOKING_URL = '';
let TOKEN = null, LIVE = false, ASSESS = {};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null && text !== '') e.textContent = text; return e; };
const add = (parent, ...kids) => { kids.flat().forEach(k => k && parent.append(k)); return parent; };
const has = v => v != null && v !== '' && !(Array.isArray(v) && !v.length) && !(typeof v === 'object' && !Array.isArray(v) && !Object.values(v).some(has));
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs) => { const e = document.createElementNS(NS, tag); Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
const icon = d => { const s = svg('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.5', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }); s.append(svg('path', { d })); return s; };
const ARROW = 'M4 12h15M13 6l6 6-6 6', CHEV = 'M9 6l6 6-6 6', PLUS = 'M12 5v14M5 12h14';
const K = (t, ink) => el('div', 'k' + (ink ? ' ink' : ''), t);
const P = (t, cls) => t ? el('p', cls || 'body', t) : null;
const block = (label, text) => text ? add(el('div', 'block'), K(label, true), el('p', null, text)) : null;

let R = null, who = {}, printing = false;
// Reading style: right-brain readers get the whole picture first (map, images, shapes); left-brain readers get structure first.
const styleOf = () => { const s = (R.meta || {}).style; if (s) return s; const b = (R.mind || {}).brain || {}, L = +b.left || 0, Rr = +b.right || 0; return L && Rr ? (Rr / L > 1.5 ? 'right' : L / Rr > 1.5 ? 'left' : 'balanced') : 'balanced'; };

// ---------- data ----------
async function getData() {
  const params = new URLSearchParams(location.search);
  if (params.has('preview')) {
    let p = null; try { p = JSON.parse(localStorage.getItem(PREVIEW_KEY) || 'null'); } catch (_) {}
    if (!p || !p.data || Date.now() - Date.parse(p.at || 0) > 6 * 3600e3) { try { localStorage.removeItem(PREVIEW_KEY); } catch (_) {} throw Object.assign(new Error('Open the preview from the founder console.'), { title: 'No preview loaded.' }); }
    $('previewBar').hidden = false;
    return { report: { ...p.data, published_at: p.at }, who: { first_name: p.name || (p.data.meta && p.data.meta.name || '').split(' ')[0], reference: p.reference || '' } };
  }
  if (params.has('sample')) {
    $('previewBar').hidden = false; $('previewBar').textContent = 'Sample report · fictional client';
    return { report: SAMPLE(), who: { first_name: 'Sample client', reference: 'SAMPLE' } };
  }
  const q = (params.get('invite') || '').trim().toLowerCase();
  let token = null; LIVE = true;
  try { if (q) { localStorage.setItem(KEY, q); sessionStorage.setItem(KEY, q); } token = q || sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (_) { token = q || null; }
  if (q) history.replaceState(null, '', location.pathname + location.hash);
  if (!token) throw Object.assign(new Error('This report opens from the private link Maktoub sent you. Open that link once on this device and your report will be here.'), { title: 'Please open your private link.' });
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'load', token }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Please try again in a moment.'), { title: r.status === 401 ? 'This link is no longer active.' : 'We could not open your report.' });
  if (!j.report) throw Object.assign(new Error('Your voice report appears here once it has been written and released. We will let you know.'), { title: 'Your report is being prepared.', portal: true });
  TOKEN = token; (j.assessments || []).forEach(a => { ASSESS[a.kind] = a; });
  return { report: j.report, who: { first_name: j.first_name, reference: j.reference } };
}

// ---------- chapters ----------
const CH = [
  { k: 'overview', n: '', t: 'Your report', short: 'Overview' },
  { k: 'emotional', n: '01', t: 'Emotional Mastery', lead: 'Your emotional state: the emotions that give you energy, the ones that take it, the one that keeps showing up, and the one underneath.' },
  { k: 'mind', n: '02', t: 'How Your Mind Works', lead: 'How you take information in, how you process it, and what kind of stress your system is carrying.' },
  { k: 'social', n: '03', t: 'Social Mirror', lead: 'Your present character, your real intention, your constructive attributes and the seven leadership dynamics.' },
  { k: 'negativity', n: '04', t: 'Negativity', lead: 'Your top five restrictive attributes: past incidents that could be a block to your present actions.' },
  { k: 'body', n: '05', t: 'Mind & Body', lead: 'Potential mental and physical wellness challenges, and the organs EmoWave indicates.' },
  { k: 'journey', n: '06', t: 'Life Journey', lead: 'Past experiences shaped your thoughts. Each period of your life shows green, orange or red: where you gained energy, and where you faced your hardest challenges.' },
];

// Each chapter returns panels: [{ k, label, build() }]
const PANELS = {
  emotional(d) {
    const slots = [
      ['thrive', 'Empowering', 'Empowering', 'Which emotions give you energy?'],
      ['drain', 'Dis-empowering', 'Dis-empowering', 'Which emotions take energy from you?'],
      ['visible', 'Frequent', 'Frequent emotion', 'The emotion that keeps showing up.'],
      ['deep', 'Core', 'Core emotion', 'The strongest emotion underneath the frequent one.'],
    ].filter(([k]) => d[k] && d[k].emotion);
    return slots.map(([k, label, kicker, q]) => ({ k, label, build() {
      const s = d[k], w = add(el('div', 'emo'), K(kicker), el('p', 'q', q), el('div', 'big word', s.emotion), P(s.text));
      if (s.also && s.also.length) add(w, add(el('div', 'chips'), s.also.map(a => el('span', 'chip', a))));
      const detail = [block('The deeper read', s.deep), block('What this may mean', s.meaning), block('What to pay attention to', s.attention)].filter(Boolean);
      if (detail.length) {
        const b = add(el('button', 'more'), document.createTextNode('Read more'), icon(ARROW)); b.type = 'button';
        b.onclick = () => openSheet(kicker, s.emotion, detail.map(n => n.cloneNode(true)), true);
        add(w, b, add(el('div', 'sheetcopy'), detail.map(n => n.cloneNode(true))));
      }
      return w;
    } })).concat(has(d.tones) ? [{ k: 'tone', label: 'Notes', build() {
      return add(el('div'), K('Rhythmic pattern'), el('p', 'q', 'The general reaction for each note in your voice.'),
        add(el('div', 'tones'), d.tones.map(t => add(el('article'), el('div', 'note', t.note || '·'), P(t.text, ' ')))));
    } }] : []);
  },
  mind(d) {
    const out = [];
    const se = d.sensory;
    if (se && (se.base && se.base.sense || se.next && se.next.sense)) out.push({ k: 'process', label: 'Process', build() {
      const w = add(el('div'), K('Sensory attributes'), el('p', 'q', 'How do you take information in, and how do you work with it?'));
      const stage = (lab, s, which) => {
        const st = add(el('div', 'stage'), K(lab), el('h4', null, s.sense || '·'));
        [['Sense', s.sense, s.text], ['Direction', s.direction, s.direction_text], ['Energy', s.energy, s.energy_text]].forEach(([t, v, txt]) => {
          if (!v) return; const b = add(el('button', 'node'), el('span', 't', t), el('b', null, v), txt ? icon(CHEV) : null); b.type = 'button';
          if (txt) b.onclick = () => openSheet(lab + ' · ' + t, v, [el('p', 'body', txt)]); else b.disabled = true;
          st.append(b);
        });
        return st;
      };
      add(w, add(el('div', 'flow'), se.base && stage('First: take in', se.base), add(el('div', 'arrow'), icon(ARROW)), se.next && stage('Then: process', se.next)));
      add(w, P(se.text));
      return w;
    } });
    if (d.brain && (+d.brain.left || +d.brain.right)) out.push({ k: 'brain', label: 'Brain', build() {
      const L = +d.brain.left || 0, Rr = +d.brain.right || 0, tot = (L + Rr) || 1, leadR = Rr >= L;
      const w = add(el('div'), K('Brain activity'), el('p', 'q', 'Which side of your brain is leading?'), el('div', 'big', d.brain.label || (leadR ? 'Right-brain led' : 'Left-brain led')));
      const h = el('div', 'hemi'), row = el('div', 'row');
      add(row, add(el('div', 'side' + (leadR ? ' dim' : '')), K('Left'), el('div', 'num', String(L)), el('small', null, 'Structure, sequence, logic')),
        add(el('div', 'side r' + (leadR ? '' : ' dim')), K('Right'), el('div', 'num', String(Rr)), el('small', null, 'Pattern, intuition, synthesis')));
      const trk = el('div', 'trk' + (leadR ? '' : ' lead-l')), il = el('i', 'l'), ir = el('i', 'r');
      il.style.width = '50%'; ir.style.width = '50%'; trk.append(il, ir);
      requestAnimationFrame(() => requestAnimationFrame(() => { il.style.width = (L / tot * 100) + '%'; ir.style.width = (Rr / tot * 100) + '%'; }));
      add(h, row, trk); add(w, h, K('What this suggests', true), P(d.brain.text), d.brain.line ? el('p', 'line', d.brain.line) : null);
      if (has(d.brain.helps) || has(d.brain.drains)) add(w, add(el('div', 'ways'), has(d.brain.helps) ? add(el('div'), K('How you take things in best', true), add(el('ul'), d.brain.helps.map(x => el('li', null, x)))) : null, has(d.brain.drains) ? add(el('div', 'dr'), K('What wears you down', true), add(el('ul'), d.brain.drains.map(x => el('li', null, x)))) : null));
      return w;
    } });
    if (d.stress && (d.stress.value != null || d.stress.type)) out.push({ k: 'stress', label: 'Stress', build() {
      const v = d.stress.value != null && d.stress.value !== '' ? +d.stress.value : null;
      const w = add(el('div'), K('Stress level'), el('p', 'q', 'What kind of stress is your system carrying?'), el('div', 'big', d.stress.type || d.stress.band || ''));
      if (v != null && isFinite(v)) add(w, add(el('div', 'gauge'), add(el('div', 'val'), el('b', null, v.toFixed(2)), K('EmoWave stress level'))));
      add(w, P(d.stress.text));
      if (d.stress.source) add(w, add(el('blockquote', 'src'), K('In EmoWave’s words'), el('p', null, d.stress.source)));
      return w;
    } });
    return out;
  },
  social(d) {
    const out = [];
    if (d.archetype && d.archetype.name) out.push({ k: 'archetype', label: 'Present character', build() {
      const w = add(el('div'), K('Present character'), el('div', 'big', d.archetype.name), el('p', 'sub', d.archetype.sub), P(d.archetype.text));
      const rows = (d.perception || []).map(p => typeof p === 'string' ? { t: p } : p).filter(p => p.t);
      if (rows.length || d.perception_summary) add(w, el('div', null), add(el('div', 'block'), K('Your top 5 constructive attributes', true), d.perception_summary ? el('p', null, d.perception_summary) : null), rows.length ? acc(rows.map(r => ({ t: r.t, d: r.d }))) : null);
      return w;
    } });
    if (d.motivator && d.motivator.name) out.push({ k: 'motivator', label: 'Real intention', build() {
      return add(el('div'), K('Real intention'), el('div', 'big', d.motivator.name), el('p', 'sub', d.motivator.sub), P(d.motivator.text), block('Driving force', d.motivator.force));
    } });
    if (has(d.leadership)) out.push({ k: 'leadership', label: 'Leadership', build() {
      const w = add(el('div'), K('Leadership profile'), el('div', 'big', 'Seven dynamics'), d.leadership_summary ? P(d.leadership_summary) : null);
      if (styleOf() === 'right' || printing) w.append(radar(d.leadership));
      return add(w, acc(d.leadership.map(x => ({ t: x.t, sub: x.sub, d: x.d, level: x.level }))));
    } });
    return out;
  },
  negativity(d) {

        add(el('div', 'meta'), el('span', null, T.items.length + ' statements'), el('span', null, 'About ' + T.minutes + ' minutes'), done ? el('span', 'ok', 'Completed') : started ? el('span', null, answered + ' of ' + T.items.length + ' answered') : null));
      if (!done) { const b = add(el('button', 'cta'), document.createTextNode(started ? 'Continue' : 'Start'), icon(ARROW)); b.type = 'button'; b.onclick = () => runTest(k); card.append(b); }

}

// ---------- assessments: one statement per screen, saved as you go ----------
let saveTimer = null;
async function saveTest(k, submit) {
  const st = ASSESS[k];
  if (!LIVE || !TOKEN) { if (submit) st.completed_at = new Date().toISOString(); return { ok: true, local: true }; }
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save_assessment', token: TOKEN, kind: k, answers: st.answers, submit: !!submit }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Your answers could not be saved. Check your connection and try again.');
  st.saved_at = j.saved_at; if (j.completed_at) st.completed_at = j.completed_at;
  return j;
}
function runTest(k) {
  const T = MaktoubAssessments[k], n = T.items.length;
  const st = ASSESS[k] = ASSESS[k] || {};
  if (!Array.isArray(st.answers) || st.answers.length !== n) st.answers = Array(n).fill(null);
  let i = st.answers.findIndex(a => a == null); if (i < 0) i = n;
  const q = $('quiz'), body = $('quizBody'), bar = $('quizBar'), cnt = $('quizCount');
  $('quizName').textContent = T.name; q.hidden = false; document.body.style.overflow = 'hidden';
  const msg = el('p', 'qmsg');
  const close = () => { clearTimeout(saveTimer); if (LIVE && TOKEN && !st.completed_at) saveTest(k).catch(() => {}); q.hidden = true; document.body.style.overflow = ''; route(true); };
  $('quizClose').onclick = close;
  const queueSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveTest(k).then(() => { msg.textContent = ''; }).catch(e => { msg.textContent = e.message; }), 900); };
  const show = () => {
    const answered = st.answers.filter(a => a != null).length;
    bar.style.width = (answered / n * 100) + '%'; cnt.textContent = Math.min(i + 1, n) + ' / ' + n;
    body.replaceChildren();
    if (i === -1) { // intro
      add(body, el('p', 'k', T.kicker), el('h2', null, T.name), el('p', 'body', T.intro), (!LIVE ? el('p', 'qmsg', 'Preview: answers are not saved.') : null));
      const b = add(el('button', 'cta'), document.createTextNode('Begin'), icon(ARROW)); b.type = 'button'; b.onclick = () => { i = 0; show(); }; body.append(b); return;
    }
    if (i >= n) { // review and submit
      const missing = st.answers.map((a, j) => a == null ? j : -1).filter(j => j >= 0);
      add(body, el('p', 'k', 'All done'), el('h2', null, missing.length ? missing.length + ' left to answer' : 'Ready to send'), el('p', 'body', missing.length ? 'Go back to the statements you skipped, then send your answers.' : 'Your answers go to us privately. We will go through them with you in your session.'));
      if (missing.length) { const b = el('button', 'cta', 'Go to the first one'); b.type = 'button'; b.onclick = () => { i = missing[0]; show(); }; body.append(b); }
      else {
        const b = add(el('button', 'cta'), document.createTextNode('Send my answers'), icon(ARROW)); b.type = 'button';
        b.onclick = async () => { b.disabled = true; msg.textContent = 'Sending…'; clearTimeout(saveTimer);
          try { await saveTest(k, true); body.replaceChildren(add(el('div', 'qdone'), el('p', 'k', 'Sent'), el('h2', null, 'Thank you.'), el('p', 'body', 'Your answers have reached us. We will go through them together.'))); const c = el('button', 'cta', 'Back to recommendations'); c.type = 'button'; c.onclick = close; body.append(c); bar.style.width = '100%'; }
          catch (e) { msg.textContent = e.message; b.disabled = false; } };
        body.append(b);
      }
      const back = el('button', 'qback', '← Back'); back.type = 'button'; back.onclick = () => { i = n - 1; show(); };
      add(body, msg, back); return;
    }
    const it = T.items[i];
    add(body, el('p', 'k', T.stem), el('h2', 'stmt', it.t));
    const opts = el('div', 'likert'); opts.setAttribute('role', 'radiogroup'); opts.setAttribute('aria-label', it.t);
    T.labels.forEach((lab, j) => {
      const v = j + 1, b = add(el('button', 'opt'), el('span', 'n', String(v)), el('span', null, lab)); b.type = 'button';
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(st.answers[i] === v));
      b.onclick = () => { st.answers[i] = v; queueSave(); opts.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-checked', String(x === b))); setTimeout(() => { i++; show(); }, 220); };
      opts.append(b);
    });
    const nav = el('div', 'qnav');
    const back = el('button', 'qback', '← Back'); back.type = 'button'; back.disabled = i === 0; back.onclick = () => { i--; show(); };
    const skip = el('button', 'qback', 'Skip →'); skip.type = 'button'; skip.onclick = () => { i++; show(); };
    add(body, opts, add(nav, back, skip), msg);
  };
  if (!st.answers.some(a => a != null)) i = -1;
  show();
}

function go(k, keepScroll) { if (location.hash.slice(1) !== k) history.pushState(null, '', '#' + k); route(keepScroll); }
function route(keepScroll) {

  $('chapters').hidden = view !== 'report';
  const main = $('main'); main.replaceChildren();
  if (view !== 'report') main.append(notesView(view));
  else {
    const c = CH.find(x => x.k === h) || CH[0];
    document.querySelectorAll('#chapterTabs button').forEach(b => { const on = b.dataset.k === c.k; b.setAttribute('aria-selected', String(on)); if (on) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: keepScroll ? 'auto' : 'smooth' }); });
